name: TypeScript Tests

on:
  push:
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Run Jest tests
        run: npm test

  integration-test:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - run: npm ci

    - name: Setup AWS SAM
      uses: aws-actions/setup-sam@v2

    - name: Build TypeScript
      run: npm run build

    - name: Start SAM API
      run: |
        sam local start-api > sam.log 2>&1 &
        echo $! > sam.pid

    - name: Wait for API
      run: |
        for i in {1..30}; do
          if curl --fail --silent \
            http://127.0.0.1:3000/hello > /dev/null; then
            echo "SAM API is ready"
            exit 0
          fi
          echo "Waiting for SAM..."
          sleep 2
        done
        echo "SAM failed to start"
        cat sam.log
        exit 1

    - name: Test deployed API
      env:
        API_BASE_URL: http://127.0.0.1:3000
      run: npm run test:integration